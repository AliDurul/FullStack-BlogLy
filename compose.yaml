services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    # Next.js default port
    ports:
      - "3000:3000"
    # Use env_file if .env.local exists
    env_file:
      - ./client/.env.local
    networks:
      - blogly-net
    depends_on:
      - db
      - api

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    networks:
      - blogly-net
    depends_on:
      - db

  db:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - blogly-net
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # MongoDB is used for persistent data storage
    volumes:
      - mongo-data:/data/db

networks:
  blogly-net:
    driver: bridge

volumes:
  mongo-data:
    # Persistent storage for MongoDB
